name: Daily Tech Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch quote and update README
        run: |
          curl -s https://zenquotes.io/api/random -o quote.json
          cat quote.json
          python3 << 'PYEOF'
          import json, re

          with open("quote.json") as f:
              data = json.load(f)[0]

          quote_line = f'> "{data["q"]}" – {data["a"]}'

          with open("README.md") as f:
              content = f.read()

          new_block = f"<!-- QUOTE_START -->\n{quote_line}\n<!-- QUOTE_END -->"
          content = re.sub(
              r"<!-- QUOTE_START -->.*?<!-- QUOTE_END -->",
              new_block,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update daily quote" || echo "No changes to commit"
          git push
